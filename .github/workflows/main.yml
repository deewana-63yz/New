name: Build Interexive - Easy APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Prepare HTML app
        shell: bash
        run: |
          set -euo pipefail

          if [ -f index.html ]; then
            HTML_FILE=index.html
          else
            mapfile -t FILES < <(find . -maxdepth 1 -type f -iname '*.html')
            if [ "${#FILES[@]}" -ne 1 ]; then
              echo "ERROR: Add one HTML file to the repository root, or name it index.html."
              exit 1
            fi
            HTML_FILE="${FILES[0]}"
          fi

          mkdir -p assets
cp logo.png assets/logo.png

npx cap add android
npx @capacitor/assets generate --android
npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Interexive-Easy-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
