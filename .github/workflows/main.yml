name: Build APK

on:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Set app icon
        run: |
          sed -i '/^icon.filename[[:space:]]*=/d' buildozer.spec
          sed -i '/^\[app\]/a icon.filename = %(source.dir)s/icon.png' buildozer.spec
          
      - name: Build APK
        uses: ArtemSBulgakov/buildozer-action@v1
        id: buildozer
        with:
          command: buildozer android debug
          workdir: .
          buildozer_version: stable

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Night-Perfect-APK
          path: ${{ steps.buildozer.outputs.filename }}
