name: Build APK

on:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Set app icon
        run: |
          if [ ! -f icon.png ]; then
            echo "icon.png missing"
            exit 1
          fi
          if [ ! -f buildozer.spec ]; then
            echo "buildozer.spec missing"
            exit 1
          fi
          grep -q '^\[app\]' buildozer.spec || exit 1
          sed -i '/^[[:space:]]*icon.filename[[:space:]]*=/d' buildozer.spec
          sed -i '/^\[app\]/a icon.filename = %(source.dir)s/icon.png' buildozer.speczer.spec
          
      - name: Build APK
        uses: ArtemSBulgakov/buildozer-action@v1
        id: buildozer
        with:
          command: buildozer android debug
          workdir: .
          buildozer_version: stable

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Night-Perfect-APK
          path: ${{ steps.buildozer.outputs.filename }}
